name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build OTA app bundle
        run: npm run release:ota-bundle

      - name: Upload OTA app bundle
        uses: actions/upload-artifact@v7
        with:
          name: metapi-ota-bundle-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error

      - name: Upload built dist
        uses: actions/upload-artifact@v7
        with:
          name: metapi-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error

  build-packages:
    name: Build Desktop Package (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            artifactLabel: linux-x64
          - platform: windows
            runner: windows-latest
            artifactLabel: windows-x64
          - platform: mac-arm64
            # macos-15 (arm64) runners are scarce; jobs sat queued for 15 min
            # and were cancelled on 2026-10-28 while the Intel label ran fine.
            # electron-builder cross-builds the arm64 bundle on Intel (verified
            # by verifyMacArchitecture.mjs below), so use the reliably available
            # Intel image instead of depending on Apple Silicon capacity.
            runner: macos-15-intel
            artifactLabel: mac-arm64
            packageCommand: npx electron-builder --config electron-builder.yml --publish never --mac --arm64
            expectedMacArch: arm64
          - platform: mac-x64
            runner: macos-15-intel
            artifactLabel: mac-x64
            packageCommand: npx electron-builder --config electron-builder.yml --publish never --mac --x64
            expectedMacArch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore Electron cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'electron-builder.yml') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-

      - name: Restore Electron cache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ${{ runner.temp }}/.cache/appimage-tools
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'electron-builder.yml') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-

      - name: Restore Electron cache (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'electron-builder.yml') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-

      # Desktop packaging only needs package sources + prebuilt native addons.
      # Electron 42 no longer ships a postinstall binary download, and npm still
      # invokes node-gyp for packages that ship binding.gyp (better-sqlite3) even
      # when N-API prebuilds exist — that breaks Windows runners without a usable
      # VS toolchain. Skip lifecycle scripts, then install Electron explicitly.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Electron binary
        shell: bash
        env:
          electron_config_cache: ${{ runner.temp }}/.cache/electron
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
        run: |
          set -euo pipefail
          # mac-x64 matrix builds Intel packages; force the matching Electron arch.
          if [ "${{ matrix.platform }}" = "mac-x64" ]; then
            export npm_config_arch=x64
            export ELECTRON_INSTALL_ARCH=x64
          elif [ "${{ matrix.platform }}" = "mac-arm64" ]; then
            export npm_config_arch=arm64
            export ELECTRON_INSTALL_ARCH=arm64
          fi
          node node_modules/electron/install.js
          test -d node_modules/electron/dist

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm

      - name: Download built dist
        uses: actions/download-artifact@v8
        with:
          name: metapi-dist-${{ github.sha }}
          path: dist

      - name: Build desktop artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          WIN_CSC_LINK_INPUT: ${{ secrets.CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_INPUT: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if ($env:WIN_CSC_LINK_INPUT) { $env:WIN_CSC_LINK = $env:WIN_CSC_LINK_INPUT }
          if ($env:WIN_CSC_KEY_PASSWORD_INPUT) { $env:WIN_CSC_KEY_PASSWORD = $env:WIN_CSC_KEY_PASSWORD_INPUT }
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Host "Desktop build attempt $attempt/2"
            npx electron-builder --config electron-builder.yml --publish never
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq 2) {
              exit $LASTEXITCODE
            }
            Start-Sleep -Seconds 90
          }

      - name: Smoke test packaged native modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ELECTRON_RUN_AS_NODE: 1
        run: |
          $appRoot = Join-Path $PWD 'release\win-unpacked\resources\app'
          $exePath = Join-Path $PWD 'release\win-unpacked\Metapi.exe'
          Push-Location $appRoot
          try {
            & $exePath -e "require('./node_modules/better-sqlite3'); console.log('better-sqlite3 ok')"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } finally {
            Pop-Location
          }

      - name: Build desktop artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Desktop build attempt ${attempt}/2"
            if npx electron-builder --config electron-builder.yml --publish never; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            sleep 90
          done

      - name: Disable Spotlight indexing (keeps hdiutil detach from failing with "Resource busy")
        if: startsWith(matrix.platform, 'mac-')
        shell: bash
        run: sudo mdutil -a -i off

      - name: Build desktop artifacts (macOS)
        if: startsWith(matrix.platform, 'mac-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          APPLE_ID_INPUT: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_INPUT: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_INPUT: ${{ secrets.APPLE_TEAM_ID }}
          PACKAGE_COMMAND: ${{ matrix.packageCommand }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_ID_INPUT:-}" ]; then export APPLE_ID="$APPLE_ID_INPUT"; fi
          if [ -n "${APPLE_APP_SPECIFIC_PASSWORD_INPUT:-}" ]; then export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_INPUT"; fi
          if [ -n "${APPLE_TEAM_ID_INPUT:-}" ]; then export APPLE_TEAM_ID="$APPLE_TEAM_ID_INPUT"; fi
          for attempt in 1 2; do
            echo "Desktop build (${PACKAGE_COMMAND}) attempt ${attempt}/2"
            if eval "${PACKAGE_COMMAND}"; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            sleep 90
          done

      - name: Verify packaged macOS architecture
        if: startsWith(matrix.platform, 'mac-')
        shell: bash
        env:
          expectedMacArch: ${{ matrix.expectedMacArch }}
        run: |
          node scripts/desktop/verifyMacArchitecture.mjs --release-dir release --expected-arch "$expectedMacArch"

      - name: Upload desktop package
        uses: actions/upload-artifact@v7
        with:
          name: metapi-desktop-${{ github.run_id }}-${{ matrix.artifactLabel }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.blockmap
            release/latest*.yml
            release/latest*.json
            release/builder-debug.yml
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Show release files
        run: ls -la release-assets

      # Body = download badge list (built from the uploaded file names, never
      # from a hardcoded version) + GitHub's generated notes below it.
      - name: Generate release body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release/generateDownloadBadges.mjs \
            --tag "${{ github.ref_name }}" --dir release-assets --registries \
            --out "$RUNNER_TEMP/downloads.md"
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" --jq .body > "$RUNNER_TEMP/notes.md"
          # The badge table is a raw HTML block: the blank line is what ends it,
          # so the separator below renders as a rule instead of literal text.
          { cat "$RUNNER_TEMP/downloads.md"; echo; echo '---'; echo; cat "$RUNNER_TEMP/notes.md"; } \
            > "$RUNNER_TEMP/release-body.md"
          head -20 "$RUNNER_TEMP/release-body.md"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-body.md
          files: release-assets/*

      # Re-pushing a tag must not stack a second copy of the notes on the
      # existing release: this pins the body to exactly what this run built,
      # so a re-run replaces the text instead of growing it.
      - name: Pin the release body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes-file "$RUNNER_TEMP/release-body.md"

  publish-docker-arch:
    name: Publish Docker Image (${{ matrix.arch }})
    # Docker images are built from source and do not consume desktop packages.
    # Keep them independent of build-packages so a scarce/queued macOS runner
    # cannot block the server image release (2026-10-28 incident: mac-arm64
    # stayed queued and the whole tag produced no image).
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Fork-friendly: only push Docker images when the operator has configured
    # their OWN Docker Hub credentials. Forks without these secrets skip both
    # Docker jobs instead of failing (and never write to the upstream image
    # namespace).
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.event.head_commit.message, '[ci skip]')
    env:
      DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/metapi
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure Docker Hub secrets are configured
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing Docker Hub secrets: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Add architecture suffix to tags
        id: arch-tags
        shell: bash
        run: |
          set -euo pipefail
          rm -f tags.txt
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "${tag}-${{ matrix.arch }}" >> tags.txt
          done <<< "${{ steps.meta.outputs.tags }}"
          {
            echo 'tags<<EOF'
            cat tags.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.platform }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.arch-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

  publish-docker:
    name: Publish Docker Manifests
    needs: publish-docker-arch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.event.head_commit.message, '[ci skip]')
    env:
      DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/metapi

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure Docker Hub secrets are configured
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing Docker Hub secrets: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Create multi-arch manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create \
              --tag "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"
