appId: me.cita777.metapi.desktop
productName: Metapi
artifactName: ${name}-${version}-${os}-${arch}.${ext}
directories:
  output: release
electronDist: node_modules/electron/dist
icon: build/desktop-icon.png
asar: false
# better-sqlite3 13.x ships N-API prebuilds per platform; skip electron-builder's
# native rebuild step (it invokes node-gyp for better-sqlite3 and fails on
# Windows runners without a usable VS toolchain).
npmRebuild: false
files:
  - dist/**/*
  - drizzle/**/*
  - package.json
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlementsInherit: null
win:
  target:
    - nsis
    - zip
linux:
  target:
    - AppImage
    - deb
    - rpm
  maintainer: wyf9661 <wyf9661@hotmail.com>
publish:
  provider: github
  owner: wyf9661
  repo: metapi
  releaseType: release
  publishAutoUpdate: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
afterPack: scripts/desktop/afterPack.mjs
afterSign: scripts/desktop/afterSign.mjs
