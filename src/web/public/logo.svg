<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="metapi-core" x1="0" y1="64" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="metapi-flow" x1="0" y1="56" x2="64" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Three source nodes: scattered upstream API sites (symmetric about x=32) -->
  <circle cx="11" cy="50" r="3.4" fill="#0d9488"/>
  <circle cx="53" cy="50" r="3.4" fill="#0d9488"/>
  <circle cx="32" cy="53" r="3.4" fill="#0d9488"/>

  <!-- Flows converging into the gateway.
       Each flow starts exactly r + strokeWidth/2 away from its source node
       and ends exactly R + strokeWidth/2 at the gateway circle, so both
       round caps meet their circles tangentially: identical overlap on all
       three nodes and at the core, no gap, no intrusion. -->
  <path d="M13.87 45.08 C 19 36.5, 25.5 29, 26.31 23.76" stroke="url(#metapi-flow)" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M50.13 45.08 C 45 36.5, 38.5 29, 37.69 23.76" stroke="url(#metapi-flow)" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M32 47.3 C 32 38, 32 30, 32 25.3" stroke="url(#metapi-flow)" stroke-width="4.6" stroke-linecap="round"/>

  <!-- Unified gateway core -->
  <circle cx="32" cy="14" r="9" fill="url(#metapi-core)"/>
  <circle cx="32" cy="14" r="3.4" fill="#ffffff" fill-opacity="0.94"/>
</svg>
